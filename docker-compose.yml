services:
  wifi-dashboard:
    build: .
    container_name: airtel-wifi-dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - wifi-dashboard-data:/data
    environment:
      WIFI_ROUTER_URL: http://192.168.1.1
      WIFI_ADMIN_PASSWORD: ${WIFI_ADMIN_PASSWORD:?Create a .env file with WIFI_ADMIN_PASSWORD}

volumes:
  wifi-dashboard-data:
